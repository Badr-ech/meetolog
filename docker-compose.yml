# =============================================================================
# Meetolog – Local Development Stack (Docker Compose)
#
# Services:
#   db              PostgreSQL 15   (job queue, metadata, artifacts)
#   minio           MinIO           (local S3-compatible object store)
#   minio-setup     mc CLI          (one-shot bucket provisioning)
#   api             FastAPI         (HTTP API on :8000)
#   worker          Python worker   (stateless Postgres-polling pipeline)
#
# Usage:
#   docker compose up --build -d
#   docker compose exec api alembic upgrade head   # first run only
#
# Scale workers:
#   docker compose up --build -d --scale worker=3
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meetolog
      POSTGRES_PASSWORD: meetolog
      POSTGRES_DB: meetolog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetolog"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meetolog

  # MinIO — S3-compatible object storage for local development
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meetolog

  # MinIO bucket provisioning (runs once then exits)
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/meetolog-uploads;
      echo 'Bucket meetolog-uploads is ready';
      "
    networks:
      - meetolog

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - meetolog

  # Stateless background worker (horizontally scalable)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    entrypoint: ["python", "-m", "app.worker"]
    command: []
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - meetolog

volumes:
  postgres_data:
  minio_data:

networks:
  meetolog:
    driver: bridge
