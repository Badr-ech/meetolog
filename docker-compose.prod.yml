# =============================================================================
# Meetolog – Local Production-Like Stack
#
# Mirrors the Render deployment:
#   - Redis           (shared state + job queue)
#   - Backend API     (FastAPI, SERVICE_TYPE=web)
#   - Backend Worker  (ARQ,     SERVICE_TYPE=worker)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# The Next.js frontend is NOT included here — run it separately with
#   NEXT_PUBLIC_API_URL=http://localhost:8000 npm run dev
# or deploy to Vercel.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis – Shared state store & job queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend API – FastAPI web server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SERVICE_TYPE: web
      PORT: "8000"
      REDIS_URL: redis://redis:6379
      TEST_MODE: "${TEST_MODE:-false}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend Worker – ARQ background processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_TYPE: worker
      REDIS_URL: redis://redis:6379
      TEST_MODE: "${TEST_MODE:-false}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  uploads_data:
  outputs_data:
